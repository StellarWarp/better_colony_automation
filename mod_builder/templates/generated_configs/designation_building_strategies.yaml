building_strategy_designation_contexts:
- context: farming
  job_provider_districts:
  - district_farming
  branches:
  - name: default
    trigger: null
    exclude_triggers:
    - bca_is_farming_habitat
    job_provider_districts:
    - district_farming
    strategy_buckets:
    - strategy: district_capacity
      buildings:
      - building_farming_districts_1
    - strategy: efficiency
      buildings:
      - building_food_processing_facility
    - strategy: job_low_priority
      buildings:
      - building_hydroponics_farm
    - strategy: always
      buildings:
      - building_forever_cruise_crew_resources
  - name: bca_is_farming_habitat
    trigger: bca_is_farming_habitat
    exclude_triggers: []
    job_provider_districts:
    - district_farming
    strategy_buckets:
    - strategy: efficiency
      buildings:
      - building_food_processing_facility
    - strategy: job_only
      buildings:
      - building_hydroponics_farm
  types:
  - farming

source_directories:
  - common
  - events
  - gfx
  - interface
  - localisation

clean_paths:
  - common
  - events
  - gfx
  - interface
  - descriptor.mod
  - license
  - thumbnail.png

main:
  target: ~/Documents/Paradox Interactive/Stellaris/mod/better_colony_manage
  root_files:
    descriptor.mod: descriptor.mod
    thumbnail.png: thumbnail.png
    license: license

submods:
  job_regulation:
    target: ~/Documents/Paradox Interactive/Stellaris/mod/macroeconomy
    root_files:
      submods/job_regulation/descriptor.mod: descriptor.mod
      submods/job_regulation/thumbnail.png: thumbnail.png
  colony_automation_parallelize_patch:
    target: ~/Documents/Paradox Interactive/Stellaris/mod/colony_automation_parallelize_patch
    launcher_descriptor: ~/Documents/Paradox Interactive/Stellaris/mod/colony_automation_parallelize_patch.mod
    clean_paths:
      - descriptor.mod
      - thumbnail.png
      - README.txt
      - Install Patch.bat
      - Restore Original.bat
      - ColonyAutomationParallelizePatch.exe
      - license
    root_files:
      submods/colony_automation_parallelize_patch/descriptor.mod: descriptor.mod
      submods/colony_automation_parallelize_patch/thumbnail.png: thumbnail.png
      submods/colony_automation_parallelize_patch/README.txt: README.txt
      submods/colony_automation_parallelize_patch/Install Patch.bat: Install Patch.bat
      submods/colony_automation_parallelize_patch/Restore Original.bat: Restore Original.bat
      submods/colony_automation_parallelize_patch/dist/ColonyAutomationParallelizePatch.exe: ColonyAutomationParallelizePatch.exe
      license: license

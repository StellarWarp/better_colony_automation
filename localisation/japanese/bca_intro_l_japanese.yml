 MESSAGE_BCA_STARTUP: "Better Colony Automation 通知"
 MESSAGE_BCA_STARTUP_desc: "§YBetter Colony Automation§! by 哇噗\n\nBCA は植民地計画に従って、建造物、区域、区域特化の建設と解体を自動化し、資源確保、空き職、事前建設、経済産出目標に基づいて建設ペースを制御します。\n\n§Hクイックスタート:§!\n- 惑星画面で ['concept_planet_automation'] を有効にし、BCA に管理させたい自動化項目を残します。\n- 植民地区域設定パネルで区域特化と区域数を確認します。既定の計画は植民地指定に従います。\n- §HBCA グローバル設定§!で資源確保量、空き職しきい値、事前建設、経済管理、自動解体の既定状態を設定します。\n\n§Hグローバル設定の入口:§!\n- 植民地区域設定パネル左上のボタン。\n- §HBCA グローバル設定§!の布告。\n\n§H注意§!: 建造物、区域、区域特化の自動解体は個別に無効化できます。既定状態と一括適用はグローバル設定で調整してください。"

 MESSAGE_BCA_UPDATE: "Better Colony Automation アップデート"
 MESSAGE_BCA_UPDATE_desc: "$MESSAGE_BCA_UPDATE_desc_verson$\n$MESSAGE_BCA_UPDATE_desc_important$\n$MESSAGE_BCA_STARTUP_desc_log$"
 MESSAGE_BCA_UPDATE_desc_verson: "§YBetter Colony Automation§! が v2.1.1 に更新されました！"
 MESSAGE_BCA_UPDATE_desc_important: "§H注意§!: このMODは最近多くのアップデートがありました。詳細はワークショップページをご確認ください。\n§R注意§!: このMODは前提MODとして §1UI Overhaul Dynamic§! が必要になりました。\nフィードバックと議論: Github または ワークショップ"
 MESSAGE_BCA_STARTUP_desc_log: "$MESSAGE_BCA_STARTUP_desc_log_v211$\n$MESSAGE_BCA_STARTUP_desc_log_v210$\n$MESSAGE_BCA_STARTUP_desc_log_v203$\n$MESSAGE_BCA_STARTUP_desc_log_v200$\n\n['concept_bca_1xx_update_log']"

 MESSAGE_BCA_PARALLEL_CONSTRUCTION_PATCH: "任意導入: 並行建設パッチ"
 MESSAGE_BCA_PARALLEL_CONSTRUCTION_PATCH_desc: "§1植民地自動化の並行建設パッチ§!\n手動インストールが必要な任意導入のバイナリパッチです。植民地自動化が追加の建設キューを利用できるようになります。\n\n§H導入方法はワークショップの説明をご覧ください§!"

 MESSAGE_BCA_STARTUP_desc_log_v211: "\n§Y2026-8-1 - v2.1.1§!:\n\t- §Hグローバル設定の修正§!: 欠落していたテキスト、レイアウト、遊牧帝国の Operational Reserves 備蓄値表示を修正しました。\n\t- §H職業調整の修正§!: 自動化労働力の統計と、資源が禁止されている場合の複数産出職業の調整およびツールチップを修正しました。\n\t- §H区域計画の修正§!: 区域特化の自動解体を無効にした場合の第二区域計画コントロールを修正しました。"
 MESSAGE_BCA_STARTUP_desc_log_v210: "\n§Y2026-7-31 - v2.1.0§!:\n\t- §Gグローバル設定と経済管理§!: 経済管理の row を共通設定から生成する形に整理し、資源のライブ値とメイン画面からの入口を改善しました。\n\t- §G並行建設スロットの認識§!: BCA の建設計画は、建設中の項目が一つでもあると停止するのではなく、空いているネイティブ建設スロットをすべて利用するようになりました。職業調整は建設スロットの空き状況に関係なく各植民地を処理します。\n\t- §H計画と互換性の修正§!: 遊牧アークシップの第二区域順序、建設完了後の計画同期、指定リセットの動作を修正し、アークシップ戦闘特化向けの要塞建造物に対応しました。"

 MESSAGE_BCA_STARTUP_desc_log_v203: "\n§Y2026-7-4 - v2.0.3§!:\n\t- §H区域建設計画の修正§!: 植民地自動化が常に主要区域を優先して建設し、計画内の他の区域を無視することがある問題を修正しました。\n\t- §Hゾーン計画同期の修正§!: ゾーン自動解体を無効にしている場合、未建設の副区域ゾーン計画が誤って消去されることがある問題を修正しました。\n\t- §HUI数値と建造物解体の修正§!: 区域計画UIで一部の区域数値が正しく表示されない問題と、一部の状況で農業建造物が誤って解体される問題を修正しました。\n\t- §H職業調整ツールチップの修正§!: 英語フォント環境で資源状態マーカーが ? と表示されることがある問題を修正しました。"
 MESSAGE_BCA_STARTUP_desc_log_v200: "\n§Y2026-7-4 - v2.0.0§!:\n\t- §G帝国全体の職業統計と調整§!: オプションのサブMod §1Macroeconomy: Job Statistics & Regulation§! を追加しました。帝国全体の職業、労働力、職業産出を統計し、資源カテゴリ別フィルター、月間職業変化、自動化率、職業産出表示に対応します。\n\t\t- 選択した職業を持つ植民地をすばやく検索できます。\n\t\t- BCA の経済産出目標と調整許容範囲に基づき、関連する職業を自動で開放または閉鎖し、現在の経済に必要な生産部門へPOPを誘導します。\n\t\t- 各職業は個別に自動調整の対象にできます。統計だけを使う場合は、植民地自動化と全体職業調整を無効にできます。\n\t- §G経済管理と事前建設§!: 建設需要判定を整理し、帝国が現在その産出を必要としていない場合でも、事前建設が植民地計画に沿って区域、特化、建造物を先に建設できるようになりました。\n\t\t- より細分化された建設需要トリガーを追加し、事前建設が職業調整側の需要判定を変えないようにしました。\n\t\t- 経済目標、職業予約、事前建設の役割がより明確になり、「産出が必要か」「職業をどれだけ残すか」「計画を早めに埋めるか」を分けて制御できます。\n\t- §H設定パネルと表示修正§!: 区域計画、職業調整表示、多言語UIの表示と操作を改善しました。\n\t\t- 区域自動解体を無効にした場合、区域計画は現在の配置に同期して固定され、古い計画が解体を示し続ける問題を避けます。\n\t\t- 詳細な第二区域ボタン、動的な区域/特化テキスト、長い特化名の折り返し、職業調整ヘッダーアイコンとツールチップを修正しました。\n\t\t- グローバル設定イベントがゲームの長時間イベントタイムアウトで閉じられる問題を修正しました。\n\t\t- 英語、日本語、ロシア語のローカライズを改善し、欠落、重複、誤生成されたテキストキーを修正しました。"
 MESSAGE_BCA_STARTUP_desc_log_v180: "\n§Y2026-6-23 - v1.8.0§!:\n\t- §G生産目標しきい値§!: グローバル設定パネルで各生産タイプの目標しきい値を設定できるようになりました。帝国の月間収入が設定目標を下回る場合のみ関連する生産を拡張し、このしきい値は建設可否のみを制御して植民地計画は変更しません。バニラの Avoid Deficit 自動化オプションは削除され、より明確な生産目標しきい値に置き換えられました。\n\t- §H修正と改善§!: ゾーン自動解体を無効にした場合、設定パネルが既に建設済みのゾーンに同期するようになりました。いくつかの誤った建設戦略と、遊牧アークシップのゾーンアイコン欠落を修正しました。"
 MESSAGE_BCA_STARTUP_desc_log_v170: "\n§Y2026-6-20 - v1.7.0§!:\n\t- §GStellaris 4.4 対応§!: Stellaris 4.4 で変更されたスクリプトAPIに対応し、自動化が動作しなかった問題を修正しました。\n\t- §G遊牧アークシップ自動化§!: 新しいアークシップの指定、区域、区域特化、強化建造物、旅客宿舎の住宅自動化に対応しました。\n\t- §H建造物自動化の保守§!: 内部の建造物自動化設定を再構築し、建設と解体ルールの一貫性を改善しました。"
 MESSAGE_BCA_STARTUP_desc_log_v161: "\n§Y2026-6-15 - v1.6.1§!:\n\t- §Gマルチプレイ全体設定修正§!: 帝国全体の自動化設定を変更しても、同じロビー内の他プレイヤーには同期されなくなりました。\n\t- §Gマルチプレイ惑星UI入口修正§!: 惑星UIのグローバル設定入口は、自国の植民地にのみ表示され、現在のプレイヤー国家のパネルを正しく開くようになりました。"
 MESSAGE_BCA_STARTUP_desc_log_v160: "\n§Y2026-6-11 - v1.6§!:\n\t- §G自動建造の全体設定パネル§!: 自動建造関連の設定をまとめて管理できる帝国全体向けパネルを追加しました。\n\t- §Gグローバル自動解体設定§!: 新規初期化植民地向けに、建造物・区域・区域特化の自動解体デフォルトを個別に設定でき、既存植民地には一括適用できます。\n\t- §H全体設定UIの改善§!: パネル配置、ツールチップ、資源/職業しきい値の調整操作を改善しました。"

 MESSAGE_BCA_STARTUP_desc_log_v150: "\n§Y2026-4-6 - v1.5§!:\n\t- §G職業計算の改善§!: 以前は利用可能な職業に基づいて建設の必要性を評価する際、意図せず非主要種族の職業もカウントされていました。これを階級ごとにカウントするように変更しました。\n\t- §G自動区域設定の修正と改善§!: ベザリアン発電所や農業居住地を含むすべての資源区域タイプにおいて自動管理をサポートしました。自動区域設定を有効にすると建設が停止する問題を修正しました。\n\t- §G統合力建造物の改善§!: 統合力建造物の建設ロジックがより包括的になりました。\n\t- §G希少資源建造物ロジックの修正と改善§!: 希少資源建造物はプリセット値に適切に従うようになりました。§Vさらに、建造物スロットが満杯になった場合、一部の建造物が希少資源建造物に置き換えられることがあります。§!\n\t- §H人口組み立てロジックの改善§!: 人口組み立て建造物の建設と解体を制御するための詳細な政策を提供するようになりました。\n\t- §H建造物建設の微調整§!: 没落帝国の建造物を通常の資源建造物プランから削除しました。\n\t- §H特化建設の修正§!: 第二区域特化が主要区域に誤って建設される問題を修正しました。"
 MESSAGE_BCA_STARTUP_desc_log_v140: "\n§Y2026-4-1 - v1.4§!：\n\t- §Gエキュメノポリス建設の改善§!：建設条件を満たすエキュメノポリス候補が複数ある場合、確認しやすいように1つのイベントパネル に集約されるようになりました\n\t- §Gリゾート惑星の建設ロジックの改善§!：リゾート惑星は機能的な建造物として住居建造物のみを建設するようになりました\n\t- §G発電および採掘居住地の自動区域管理§!：発電および採掘居住地での区域管理をサポートしました。有効にすると、可能な限りすべての区域を一次資源区域に変換します\n\t- §H建造物の誤建設問題の修正§!：以前の ハイブリッド特化におけるパネル設定に基づく建設により、建設が禁止されている特化での建造物が建設される問題がありましたが、現在は建設済みの特化に基づき建設されるようになりました\n\t- §H建造物の誤解体の修正§!：行政ハイブリッド特化（統合力＋研究）において研究建造物が解体される問題が修正されました"


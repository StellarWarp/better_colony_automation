l_japanese:
  MESSAGE_BCA_STARTUP: "Better Colony Automation 通知"
 MESSAGE_BCA_STARTUP_desc: "§YBetter Colony Automation§! by 哇噗 & 红塵渡者\n\nこのMODは植民地の自動化を修正・改善します。['concept_colony']の['concept_planet_automation']と、帝国全体向けの自動建造グローバル設定パネルから動作を設定できます。\n\n§H主な機能:§!\n- §Yスマート計画:§! 惑星の指定に基づいて、目標収量を最大化するよう自動的に区画を計画・建設します\n- §Y自動解体:§! 必要に応じて不要な£building£['concept_buildings']、£district£['concept_district']、£zone£['concept_district_specialization']を自動的に削除します\n- §Yその他:§! 詳細はワークショップページをご覧ください。\n\n§H注意§!: §Y自動解体§!は['concept_planet_automation']とは独立しており、デフォルト動作はグローバル設定パネルから構成されます。\n\nMOD作者はバニラ市民権以外の政府でのプレイ経験が限られています。フィードバックとバグ報告を歓迎します！"

 MESSAGE_BCA_UPDATE: "Better Colony Automation アップデート"
 MESSAGE_BCA_UPDATE_desc: "$MESSAGE_BCA_UPDATE_desc_verson$\n$MESSAGE_BCA_UPDATE_desc_important$\n$MESSAGE_BCA_STARTUP_desc_log$"
 MESSAGE_BCA_UPDATE_desc_verson: "§YBetter Colony Automation§! が v1.7.0 に更新されました！"
 MESSAGE_BCA_UPDATE_desc_important: "§H注意§!: このMODは最近多くのアップデートがありました。詳細はワークショップページをご確認ください。\n§R注意§!: このMODは前提MODとして §1UI Overhaul Dynamic§! が必要になりました。\nフィードバックと議論: Github または ワークショップ"
 MESSAGE_BCA_STARTUP_desc_log: "$MESSAGE_BCA_STARTUP_desc_log_v170$\n$MESSAGE_BCA_STARTUP_desc_log_v161$\n$MESSAGE_BCA_STARTUP_desc_log_v160$\n$MESSAGE_BCA_STARTUP_desc_log_v150$\n$MESSAGE_BCA_STARTUP_desc_log_v140$\n\n['concept_bca_prev_update_log']"

 MESSAGE_BCA_STARTUP_desc_log_v170: "\n§Y2026-6-20 - v1.7.0§!:\n\t- §GStellaris 4.4 対応§!: Stellaris 4.4 に対応しました。\n\t- §G遊牧アークシップ自動化§!: 新しいアークシップの指定、区域、区域特化、強化建造物、旅客宿舎の住宅自動化に対応しました。\n\t- §H建造物自動化の保守§!: 内部の建造物自動化設定を再構築し、建設と解体ルールの一貫性を改善しました。"
 MESSAGE_BCA_STARTUP_desc_log_v161: "\n§Y2026-6-15 - v1.6.1§!:\n\t- §Gマルチプレイ全体設定修正§!: 帝国全体の自動化設定を変更しても、同じロビー内の他プレイヤーには同期されなくなりました。\n\t- §Gマルチプレイ惑星UI入口修正§!: 惑星UIのグローバル設定入口は、自国の植民地にのみ表示され、現在のプレイヤー国家のパネルを正しく開くようになりました。"
 MESSAGE_BCA_STARTUP_desc_log_v160: "\n§Y2026-6-11 - v1.6§!:\n\t- §G自動建造の全体設定パネル§!: 自動建造関連の設定をまとめて管理できる帝国全体向けパネルを追加しました。\n\t- §Gグローバル自動解体設定§!: 新規初期化植民地向けに、建造物・区域・区域特化の自動解体デフォルトを個別に設定でき、既存植民地には一括適用できます。\n\t- §H全体設定UIの改善§!: パネル配置、ツールチップ、資源/職業しきい値の調整操作を改善しました。"

  MESSAGE_BCA_STARTUP_desc_log_v150: "\n§Y2026-4-6 - v1.5§!:\n\t- §G職業計算の改善§!: 以前は利用可能な職業に基づいて建設の必要性を評価する際、意図せず非主要種族の職業もカウントされていました。これを階級ごとにカウントするように変更しました。\n\t- §G自動区域設定の修正と改善§!: ベザリアン発電所や農業居住地を含むすべての資源区域タイプにおいて自動管理をサポートしました。自動区域設定を有効にすると建設が停止する問題を修正しました。\n\t- §G統合力建造物の改善§!: 統合力建造物の建設ロジックがより包括的になりました。\n\t- §G希少資源建造物ロジックの修正と改善§!: 希少資源建造物はプリセット値に適切に従うようになりました。§Vさらに、建造物スロットが満杯になった場合、一部の建造物が希少資源建造物に置き換えられることがあります。§!\n\t- §H人口組み立てロジックの改善§!: 人口組み立て建造物の建設と解体を制御するための詳細な政策を提供するようになりました。\n\t- §H建造物建設の微調整§!: 没落帝国の建造物を通常の資源建造物プランから削除しました。\n\t- §H特化建設の修正§!: 第二区域特化が主要区域に誤って建設される問題を修正しました。"
  MESSAGE_BCA_STARTUP_desc_log_v140: "\n§Y2026-4-1 - v1.4§!：\n\t- §Gエキュメノポリス建設の改善§!：建設条件を満たすエキュメノポリス候補が複数ある場合、確認しやすいように1つのイベントパネル に集約されるようになりました\n\t- §Gリゾート惑星の建設ロジックの改善§!：リゾート惑星は機能的な建造物として住居建造物のみを建設するようになりました\n\t- §G発電および採掘居住地の自動区域管理§!：発電および採掘居住地での区域管理をサポートしました。有効にすると、可能な限りすべての区域を一次資源区域に変換します\n\t- §H建造物の誤建設問題の修正§!：以前の ハイブリッド特化におけるパネル設定に基づく建設により、建設が禁止されている特化での建造物が建設される問題がありましたが、現在は建設済みの特化に基づき建設されるようになりました\n\t- §H建造物の誤解体の修正§!：行政ハイブリッド特化（統合力＋研究）において研究建造物が解体される問題が修正されました"

  concept_bca_prev_update_log: "以前のアップデートログ"
  concept_bca_prev_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v130$\n$MESSAGE_BCA_STARTUP_desc_log_v120$\n$MESSAGE_BCA_STARTUP_desc_log_v110$\n$MESSAGE_BCA_STARTUP_desc_log_v102$\n$MESSAGE_BCA_STARTUP_desc_log_v101$\n$MESSAGE_BCA_STARTUP_desc_log_v100$\n\n['concept_bca_old_update_log']"

  MESSAGE_BCA_STARTUP_desc_log_v130: "\n§Y2026-2-28 - v1.3§!：\n\t- §Gパフォーマンスの最適化§!\n\t- 自動建造物解体を書き直し、バニラの建造物の変更に依存しなくなりました。§Gバニラの建造物を変更する他のMODと競合しなくなりました§!\n\t- 高度な建造物のためのスペースを空けるため、職のみを提供する建造物（研究所など）の解体に対応しました\n\t- 特定の状況下で特化の建設が停止する問題を修正しました"
  MESSAGE_BCA_STARTUP_desc_log_v120: "\n§Y2026-2-27 - v1.2§!：\n\t- 仕事を提供する建造物の建築優先度を最適化。これらの建造物は区域スロットがない場合にのみ建設されるようになりました\n\t- モニュメントタイプ建造物の建設リストを修正し、惑星制限が1の建造物のみを建設するようにしました\n\t- UI設定による区域の解体をサポート\n\t- 自動解体オプションを細分化し、建造物、区域、ブースト特化の個別オプションを追加\n\t- 誤って建設される特化の問題を修正\n\t- 複数の区域計画が利用可能な場合、常に同じ区域を優先するのではなくランダム選択を行うように変更\n\t- 植民インターフェースでコントロールパネルが表示される問題を修正"
  MESSAGE_BCA_STARTUP_desc_log_v110: "\n§Y2026-2-26 - v1.1§!：\n\t- 4.3への対応\n\t- 4.3で都市資源区域が削除されたため、関連ロジックが大幅に簡略化されました\n\t- 設計区域の建設と解体に関するいくつかの問題を修正しました"
  MESSAGE_BCA_STARTUP_desc_log_v102: "\n§Y2026-2-22 - v1.0.2§!：\n\t- §C自動区域管理§!が有効な£energy£ £minerals£ £food£の特化では、§R他の農村区域が置換されます§!（デフォルトで有効）\n\t- 職位がない場合の都市区域と主要区域の建設優先度を調整\n\t- 火山または荒野の惑星で農村区域が過剰に建設される問題を修正\n\t- 一部の古いローカライズを削除しました"
  MESSAGE_BCA_STARTUP_desc_log_v101: "\n§Y2026-2-20 - v1.0.1§!: \n\t- 区画の建設が職位の要件を無視する問題を修正しました。\n\t- 一部の区画が設定上限通りに建設されない問題を修正しました。\n\t- 区画が満杯のときに都市区画が資源特化区画に置換できない問題を修正しました。\n\t- 資源建物のハイブリッド計画建設をサポートしました。"
  MESSAGE_BCA_STARTUP_desc_log_v100: "\n§Y2026-2-20 - v1.0§!: \n\t§Y主な更新§!:\n\t- ハイブリッド計画と区画建設を設定するGUIを作成し、以前のハイブリッド計画惑星タイプを削除しました。\n\t- ハイブリッド計画の惑星は区画の自動建設/置換および対応する建造物の建設を行います。\n\t- ブースト建造物の建設ロジックを最適化し、空き職がある場合でも建設されるようになりました。\n\t- 主要特化惑星の建造ロジックを再実装しました。主要特化は建設収益に基づいて最適な建設オプションを自動的に選択するようになり、ほとんどすべてのタイプの惑星をサポートします。"

  MESSAGE_BCA_STARTUP_desc_log_v055: "\n§Y2026-1-25 - v0.5.5§!: \n\t読みやすさのために決定テキストを調整し、同じ決定の有効/無効の位置が変わらないようにしました。視覚効果を高めるためにいくつかのカスタム決定アイコンを追加しました; \n\tレア資源建設の調整: レア資源決定は工業指定惑星にのみ表示されるようになり、農村区域では、レア資源建造物が建設可能な場合、他の制限なしで関連建造物が優先されます。\n\t一部の建造物に鉱物確保制約がない問題を修正しました。"
  MESSAGE_BCA_STARTUP_desc_log_v054: "\n§Y2026-1-25 - v0.5.4§!: \n\tレア資源建造物建設調整の決定を追加; \n\t読みやすさのために決定テキストとアイコンを調整しました; 解体条件下でもPOP組立建造物が建設される問題を修正しました。POP組立建造物は1つ以上の建造物スロットと空き仕事を必要とするようになりました"
  MESSAGE_BCA_STARTUP_desc_log_v053: "\n§Y2026-1-25 - v0.5.3§!: \n\t意図しない命名ミスによって引き起こされたエネルギー出力計算エラーを修正しました"
  MESSAGE_BCA_STARTUP_desc_log_v052: "\n§Y2026-1-25 - v0.5.2§!: \n\tレア資源建造物の自動化ロジックを修正・改善：考古学精製所の建設後、他のレア資源建造物は建設されなくなります。 \n\tロボットが違法化されている場合や遺伝子進化が取得されている場合でも、ロボット組立オプションが表示される問題を修正しました。"
  MESSAGE_BCA_STARTUP_desc_log_v051: "\n§Y2026-1-25 - v0.5.1§!: \n\tエネルギー出力計算のエラーを修正し、都市区域の比率が低すぎる問題を解決しました。 \n\tブースト区域変換時にブースト特化が削除されない問題を修正しました。"
  MESSAGE_BCA_STARTUP_desc_log_v05: "\n§Y2026-1-24 - v0.5§!: \n\t§H農村区域の建設と解体§!ロジックを書き直しました。農村ブースト特化が存在する場合、MODは都市区域と農村区域を自動的に再バランスして出力を最大化します"

 MESSAGE_BCA_STARTUP_desc_log_v102: "\n§Y2026-2-22 - v1.0.2§!：\n\t- §C自動区域管理§!が有効な£energy£ £minerals£ £food£の特化では、§R他の農村区域が置換されます§!（デフォルトで有効）\n\t- 職位がない場合の都市区域と主要区域の建設優先度を調整\n\t- 火山または荒野の惑星で農村区域が過剰に建設される問題を修正\n\t- 一部の古いローカライズを削除しました"

 MESSAGE_BCA_STARTUP_desc_log_v110: "\n§Y2026-2-26 - v1.1§!：\n\t- 4.3への対応\n\t- 4.3で都市資源区域が削除されたため、関連ロジックが大幅に簡略化されました\n\t- 設計区域の建設と解体に関するいくつかの問題を修正しました"

 MESSAGE_BCA_STARTUP_desc_log_v120: "\n§Y2026-2-27 - v1.2§!：\n\t- 仕事を提供する建造物の建築優先度を最適化。これらの建造物は区域スロットがない場合にのみ建設されるようになりました\n\t- モニュメントタイプ建造物の建設リストを修正し、惑星制限が1の建造物のみを建設するようにしました\n\t- UI設定による区域の解体をサポート\n\t- 自動解体オプションを細分化し、建造物、区域、ブースト特化の個別オプションを追加\n\t- 誤って建設される特化の問題を修正\n\t- 複数の区域計画が利用可能な場合、常に同じ区域を優先するのではなくランダム選択を行うように変更\n\t- 植民インターフェースでコントロールパネルが表示される問題を修正"

 MESSAGE_BCA_STARTUP_desc_log_v130: "\n§Y2026-2-28 - v1.3§!：\n\t- 性能最適化を実施\n\t- 自動建造物解体の書き直し。これにより原版建造物の改変に依存しなくなり、原版建造物を改変するMODとの競合が減少します\n\t- 研究ラボ等、職を提供する建造物を利用して高レベル建造物のためのスロットを確保するサポートを追加\n\t- 特化建設が停止する事例を修正しました"

 concept_bca_old_update_log: "以前の更新ログ"
 concept_bca_old_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v055$\n$MESSAGE_BCA_STARTUP_desc_log_v054$\n$MESSAGE_BCA_STARTUP_desc_log_v053$\n$MESSAGE_BCA_STARTUP_desc_log_v052$\n$MESSAGE_BCA_STARTUP_desc_log_v051$\n$MESSAGE_BCA_STARTUP_desc_log_v05$"

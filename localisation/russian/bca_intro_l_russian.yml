l_russian:
  MESSAGE_BCA_STARTUP: "Уведомление Better Colony Automation"
  MESSAGE_BCA_STARTUP_desc: "§YBetter Colony Automation§! от 哇噗\n\nBCA следует вашему плану колонии, автоматически строит и сносит здания, районы и зоны специализации, а темп строительства регулируется резервами ресурсов, свободными рабочими местами, предварительным строительством и экономическими целями.\n\n§HБыстрый старт:§!\n- Включите ['concept_planet_automation'] в интерфейсе планеты и оставьте включенными те параметры автоматизации, которыми должен управлять BCA.\n- Проверьте специализации зон и количество районов на панели настроек районов колонии. По умолчанию план следует обозначению колонии.\n- В §Hглобальных настройках BCA§! задайте резервы ресурсов, пороги свободных рабочих мест, предварительное строительство, экономическое управление и поведение авто-сноса по умолчанию.\n\n§HГде открыть глобальные настройки:§!\n- Кнопка в левом верхнем углу панели настроек районов колонии.\n- Указ §HГлобальные настройки BCA§!.\n\n§HПримечание§!: Авто-снос зданий, районов и зон можно отключать отдельно. Значения по умолчанию и массовое применение настраиваются в глобальных настройках."

  MESSAGE_BCA_UPDATE: "Обновление Better Colony Automation"
  MESSAGE_BCA_UPDATE_desc: "$MESSAGE_BCA_UPDATE_desc_verson$\n$MESSAGE_BCA_UPDATE_desc_important$\n$MESSAGE_BCA_STARTUP_desc_log$"
  MESSAGE_BCA_UPDATE_desc_verson: "§YBetter Colony Automation§! обновлен до версии 2.0.0 !"
  MESSAGE_BCA_UPDATE_desc_important: "§HПримечание§!: Этот мод получил множество недавних обновлений; посетите страницу в мастерской для подробностей.\n§RПримечание§!: Этот мод теперь требует §1UI Overhaul Dynamic§! в качестве обязательного мода."
  MESSAGE_BCA_STARTUP_desc_log: "$MESSAGE_BCA_STARTUP_desc_log_v200$\n\n['concept_bca_1xx_update_log']"

  MESSAGE_BCA_STARTUP_desc_log_v200: "\n§Y2026-7-4 - v2.0.0§!:\n\t- §GСтатистика и регулирование рабочих мест§!: Добавлен опциональный сабмод §1Macroeconomy: Job Statistics & Regulation§! со статистикой рабочих мест, рабочей силы и производства от рабочих мест по всей империи, фильтрами по категориям ресурсов, месячными изменениями рабочих мест, уровнем автоматизации и показателями производства.\n\t\t- Можно быстро найти колонии, где есть выбранная должность.\n\t\t- Связанные рабочие места могут автоматически открываться или закрываться по экономическим целям BCA и допуску регулирования, направляя население в отрасли, которые сейчас нужны экономике.\n\t\t- Для каждой должности можно отдельно настроить участие в автоматическом регулировании; если нужна только статистика, можно отключить автоматизацию колоний и глобальное регулирование рабочих мест.\n\t- §GЭкономическое управление и предварительное строительство§!: Переработаны проверки спроса на строительство, поэтому предварительное строительство может заранее строить запланированные районы, зоны и здания, даже если империи пока не нужен этот тип производства.\n\t\t- Добавлены более точные триггеры строительного спроса, чтобы предварительное строительство не меняло проверки спроса для регулирования рабочих мест.\n\t\t- Экономические цели, резерв рабочих мест и предварительное строительство теперь имеют более ясные роли: нужен ли выпуск, сколько рабочих мест держать в резерве и нужно ли заранее выполнять план.\n\t- §HПанель настроек и исправления интерфейса§!: Улучшены планирование районов, отображение регулирования рабочих мест и многоязычный интерфейс.\n\t\t- Если авто-снос районов отключен, планы районов теперь синхронизируются и фиксируются по текущей планировке, не оставляя устаревших планов, которые подразумевают снос.\n\t\t- Исправлены кнопки подробных вторичных районов, динамический текст районов/зон, перенос длинных названий зон, иконки заголовков регулирования рабочих мест и подсказки.\n\t\t- Исправлено закрытие события глобальных настроек из-за тайм-аута долгих игровых событий.\n\t\t- Улучшено покрытие английской, японской и русской локализации, включая отсутствующие, дублирующиеся и неверно сгенерированные текстовые ключи."
  MESSAGE_BCA_STARTUP_desc_log_v180: "\n§Y2026-6-23 - v1.8.0§!:\n\t- §GЦелевые пороги производства§!: Панель глобальных настроек теперь поддерживает целевые пороги для разных типов производства. Автоматизация расширяет соответствующее производство только пока месячный доход империи ниже заданной цели; эти пороги только разрешают или запрещают строительство и не меняют планы колоний. Стандартная опция автоматизации Avoid Deficit удалена, и ее заменяют более понятные целевые пороги производства.\n\t- §HИсправления и улучшения удобства§!: При отключенном авто-сносе зон панель настроек теперь синхронизируется с уже построенными зонами; исправлены некоторые неверные стратегии строительства и отсутствующие иконки зон кочевого корабля-ковчега."
  MESSAGE_BCA_STARTUP_desc_log_v170: "\n§Y2026-6-20 - v1.7.0§!:\n\t- §GПоддержка Stellaris 4.4§!: Выполнена адаптация к изменённым API сценариев Stellaris 4.4 и исправлена проблема, из-за которой автоматизация не работала.\n\t- §GАвтоматизация кочевых кораблей-ковчегов§!: Добавлена поддержка новых специализаций, районов, зон, усиливающих зданий и автоматизации жилья Passenger Dorms.\n\t- §HОбслуживание автоматизации зданий§!: Переработана внутренняя конфигурация автоматизации зданий для более согласованных правил строительства и сноса."
  MESSAGE_BCA_STARTUP_desc_log_v161: "\n§Y2026-6-15 - v1.6.1§!:\n\t- §GИсправление глобальных настроек в мультиплеере§!: Изменение имперских глобальных настроек автоматизации больше не влияет на других игроков в той же сессии.\n\t- §GИсправление входа планетарной панели в мультиплеере§!: Вход в глобальные настройки на интерфейсе планеты теперь отображается только для ваших собственных колоний и корректно открывает панель вашей страны."
  MESSAGE_BCA_STARTUP_desc_log_v160: "\n§Y2026-6-11 - v1.6§!:\n\t- §GГлобальная панель настроек автоматизации§!: Добавлена единая имперская панель для управления настройками автоматизации.\n\t- §GГлобальные настройки авто-сноса§!: Теперь можно отдельно задавать поведение авто-сноса зданий, районов и зон для новых колоний, а также массово применять изменения к уже существующим колониям.\n\t- §HУлучшение панели настроек§!: Доработаны компоновка панели, подсказки и настройка порогов ресурсов и рабочих мест."

  MESSAGE_BCA_STARTUP_desc_log_v150: "\n§Y2026-4-6 - v1.5§!:\n\t- §GУлучшение расчета должностей§!: Ранее при оценке необходимости строительства на основе доступных должностей случайно учитывались должности неосновных видов. Теперь расчет ведется по социальным слоям.\n\t- §GИсправлены и улучшены автоматические настройки районов§!: Добавлена полная поддержка автоматического управления всеми типами добывающих районов, включая бетарианские электростанции и сельскохозяйственные среды обитания. Исправлена ошибка, из-за которой включение автоматических настроек районов приводило к остановке строительства.\n\t- §GУлучшение зданий, производящих единство§!: Логика строительства для зданий единства стала более комплексной.\n\t- §GИсправлена и улучшена логика зданий с редкими ресурсами§!: Здания с редкими ресурсами теперь будут корректно следовать заданным параметрам. §VКроме того, если слоты для зданий заполнены, некоторые здания могут быть заменены на здания с редкими ресурсами.§!\n\t- §HУлучшение логики сборки поселений§!: Теперь доступны более детальные политики для управления строительством и сносом зданий сборки поселений.\n\t- §HТвики строительства зданий§!: Строения угасших империй убраны из стандартных планов строительства ресурсных зданий.\n\t- §HИсправление специализации строительства§!: Исправлена проблема, при которой специализации вторичных районов некорректно строились на первичных районах."
  MESSAGE_BCA_STARTUP_desc_log_v140: "\n§Y2026-4-1 - v1.4§!:\n\t- §GУлучшено строительство экуменополисов§!: Когда несколько кандидатов на экуменополис удовлетворяют условиям строительства, они будут объединены на одной панели событий для удобства просмотра\n\t- §GУлучшена логика строительства на курортных мирах§!: Теперь на курортных мирах будут строиться только жилые здания в качестве функциональных зданий\n\t- §GАвтоматическое управление районами на энергетических и добывающих средах обитания§!: Теперь поддерживается управление районами для энергетических и добывающих сред обитания; если включено, все районы будут по возможности преобразованы в районы добычи первичных ресурсов\n\t- §HИсправлена ошибка неправильного строительства§!: Здания в прежней гибридной специализации строились согласно настройкам панели, из-за чего на специализациях, где их строительство было запрещено, они все равно появлялись. Теперь строительство зависит от уже возведенной специализации\n\t- §HИсправлен ошибочный снос зданий§!: Решена проблема сноса исследовательских зданий при административной гибридной специализации (Единство + Исследования)"

  concept_bca_1xx_update_log: "Журналы обновлений 1.x"

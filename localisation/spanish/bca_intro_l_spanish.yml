l_spanish:
  MESSAGE_BCA_STARTUP: "Notificación de Better Colony Automation"
  MESSAGE_BCA_STARTUP_desc: "§YBetter Colony Automation§! por 哇噗\n\nEste mod corrige y mejora la automatización de colonias. Configura su comportamiento mediante ['concept_planet_automation'] en ['concept_colony'], las ['concept_decision'] de planeta y las ['concept_policies'] del imperio.\n\n§HCaracterísticas principales:§!\n- §YPlanificación inteligente:§! Planifica y construye distritos automáticamente según la designación del planeta para maximizar la producción objetivo\n- §YDemolición automática:§! Elimina automáticamente £building£ ['concept_buildings'], £district£ ['concept_district'] y £zone£ ['concept_district_specialization'] innecesarios cuando es necesario\n- §YMás:§! Visita la página del Workshop para más detalles.\n\n§HNota§!: La §YDemolición automática§! es independiente de ['concept_planet_automation'], está activada por defecto y puede alternarse desde la interfaz\n\nEl autor del mod tiene experiencia limitada jugando con gobiernos fuera de los civismos básicos; ¡se agradecen los comentarios y reportes de errores!"

  MESSAGE_BCA_UPDATE: "Actualización de Better Colony Automation"
  MESSAGE_BCA_UPDATE_desc: "$MESSAGE_BCA_UPDATE_desc_verson$\n$MESSAGE_BCA_UPDATE_desc_important$\n$MESSAGE_BCA_STARTUP_desc_log$"
  MESSAGE_BCA_UPDATE_desc_verson: "§YBetter Colony Automation§! actualizado a v1.5 !"
  MESSAGE_BCA_UPDATE_desc_important: "§HNota§!: Este mod ha recibido un montón de actualizaciones recientes; consulta la página del Workshop para más detalles.\n§RNOTA§!: Este mod ahora requiere §1UI Overhaul Dynamic§! como mod prerrequisito.\nComentarios y debate: Github o Workshop"
  MESSAGE_BCA_STARTUP_desc_log: "$MESSAGE_BCA_STARTUP_desc_log_v150$\n$MESSAGE_BCA_STARTUP_desc_log_v140$\n\n['concept_bca_prev_update_log']"

  MESSAGE_BCA_STARTUP_desc_log_v150: "\n§Y2026-4-6 - v1.5§!:\n\t- §GMejoras en el cálculo de empleos§!: Antes, evaluar las necesidades de construcción según los empleos disponibles contaba sin querer los empleos de especies no primarias. Ahora se ha cambiado para contar por estrato social.\n\t- §GCorrección y mejora de los ajustes de auto-distrito§!: Se ha añadido soporte completo para la auto-gestión de todos los tipos de distrito de recursos, incluidas las centrales de roca betaria y los hábitats agrícolas. Se corrigió un problema por el que activar los ajustes de auto-distrito detenía la construcción.\n\t- §GMejoras en los edificios de unidad§!: La lógica de construcción de los edificios de unidad es ahora más completa.\n\t- §GCorrección y mejora de la lógica de edificios de recursos raros§!: Los edificios de recursos raros ahora respetan correctamente sus valores preconfigurados. §VAdemás, si los espacios de edificio están llenos, ciertos edificios pueden reemplazarse por otros de recursos raros.§!\n\t- §HMejora de la lógica de ensamblaje de población§!: Ahora ofrece políticas más detalladas para controlar la construcción y demolición de los edificios de ensamblaje de población.\n\t- §HAjustes en la construcción de edificios§!: Se eliminaron las construcciones de edificios de Imperio Caído de los planes estándar de edificios de recursos.\n\t- §HCorrección de la construcción de especializaciones§!: Se corrigió un problema por el que las especializaciones de distrito secundarias se construían incorrectamente en distritos primarios."
  MESSAGE_BCA_STARTUP_desc_log_v140: "\n§Y2026-4-1 - v1.4§!:\n\t- §GMejora de la construcción de ecumenópolis§!: Cuando varios candidatos a ecumenópolis cumplen los requisitos, se agrupan en un único panel de evento para verlos con más facilidad\n\t- §GMejora de la lógica de construcción de mundos turísticos§!: Ahora los mundos turísticos solo construirán edificios de vivienda como sus edificios funcionales\n\t- §GGestión automática de distritos para hábitats de energía y minería§!: Ahora se admite la gestión de distritos para hábitats de energía y minería; al activarla, convertirá todos los distritos posibles en distritos de recurso primario\n\t- §HCorrección de construcción incorrecta de edificios§!: Los edificios de la antigua especialización híbrida se construían según los ajustes del panel, lo que provocaba que algunos edificios se construyeran incorrectamente en especializaciones que los desactivaban; ahora se basa en la especialización ya construida\n\t- §HCorrección de demolición incorrecta de edificios§!: Se ha resuelto el problema por el que los edificios de investigación se demolían bajo la especialización híbrida administrativa (Unidad + Investigación)"

  concept_bca_prev_update_log: "Registros de actualizaciones anteriores"
  concept_bca_prev_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v130$\n$MESSAGE_BCA_STARTUP_desc_log_v120$\n$MESSAGE_BCA_STARTUP_desc_log_v110$\n$MESSAGE_BCA_STARTUP_desc_log_v102$\n$MESSAGE_BCA_STARTUP_desc_log_v101$\n$MESSAGE_BCA_STARTUP_desc_log_v100$\n\n['concept_bca_old_update_log']"

  MESSAGE_BCA_STARTUP_desc_log_v130: "\n§Y2026-2-28 - v1.3§!:\n\t- §GOptimización de rendimiento§!\n\t- Se reescribió la demolición automática de edificios; ahora no depende de modificar los edificios básicos del juego, §Gya no entra en conflicto con mods que modifican los edificios básicos§!\n\t- Se añadió soporte para demoler edificios que solo proporcionan empleos (como los laboratorios de investigación) para liberar espacio para edificios avanzados\n\t- Se corrigió un problema por el que la construcción de especializaciones se detenía en ciertas situaciones"
  MESSAGE_BCA_STARTUP_desc_log_v120: "\n§Y2026-2-27 - v1.2§!: \n\t- Se optimizó la prioridad de construcción de los edificios que proporcionan empleos; ahora estos edificios solo se construirán cuando no haya espacios de distrito disponibles\n\t- Se corrigió la lista de construcción de los edificios tipo monumento, construyendo solo edificios con un límite de 1 por planeta\n\t- Se admite la demolición de zonas configuradas mediante los ajustes de la interfaz\n\t- Se refinaron las opciones de demolición automática, añadiendo opciones separadas para edificios, distritos y zonas de bonificación\n\t- Se corrigieron problemas con especializaciones construidas incorrectamente\n\t- Cuando hay varios planes de distrito disponibles para construir, ahora se realiza una selección aleatoria en lugar de priorizar siempre el mismo distrito\n\t- Se corrigió un problema por el que el panel de control aparecía en la interfaz de colonización"
  MESSAGE_BCA_STARTUP_desc_log_v110: "\n§Y2026-2-26 - v1.1§!: \n\t- Soporte para la versión 4.3\n\t- Debido a la eliminación de la zona de recursos urbana en la 4.3, la lógica relacionada se ha simplificado mucho \n\t- Se corrigieron varios problemas con la construcción y demolición de distritos planificados"
  MESSAGE_BCA_STARTUP_desc_log_v102: "\n§Y2026-2-22 - v1.0.2§!: \n\t- Ahora, para las especializaciones de £energy£ £minerals£ £food£ con la §Cgestión automática de distritos§! activada (§Hpor defecto§!), §Rse reemplazarán los demás distritos rurales§!! \n\t- Se ajustó la prioridad de construcción entre la zona de recursos urbana y los distritos primarios cuando no existen requisitos de empleo\n\t- Se corrigió un error que causaba la construcción excesiva de distritos rurales en planetas volcánicos o salvajes.\n\t- Se eliminaron algunas localizaciones obsoletas"
  MESSAGE_BCA_STARTUP_desc_log_v101: "\n§Y2026-2-20 - v1.0.1§!: \n\t- Se corrigió un problema por el que la construcción de distritos ignoraba los requisitos de empleo.\n\t- Se corrigió un problema por el que algunos distritos no se construían hasta su límite configurado.\n\t- Se corrigió un problema por el que los distritos urbanos no podían ser reemplazados por distritos de especialización primaria cuando los distritos estaban llenos.\n\t- Se añadió soporte de construcción de planificación híbrida para los edificios de recursos."
  MESSAGE_BCA_STARTUP_desc_log_v100: "\n§Y2026-2-20 - v1.0§!: \n\t§YActualización importante§!:\n\t- Se creó una interfaz para configurar la planificación híbrida y la construcción de distritos, y se eliminaron los anteriores tipos de planeta de planificación híbrida.\n\t- Los planetas con planificación híbrida pueden construir/reemplazar distritos automáticamente y construir los edificios correspondientes.\n\t- Se optimizó la lógica de construcción de los edificios de bonificación; también se construirán cuando existan empleos libres.\n\t- Se reescribió la lógica de construcción de planetas de especialización primaria. La especialización primaria ahora seleccionará automáticamente las opciones de construcción óptimas según el rendimiento de la construcción, y ahora admite casi todos los tipos de planeta."

  MESSAGE_BCA_STARTUP_desc_log_v055: "\n§Y2026-1-25 - v0.5.5§!: \n\tSe ajustaron los textos de las decisiones para mejorar su legibilidad, y las posiciones de activar/desactivar de una misma decisión ya no cambiarán. Se añadieron varios iconos de decisión personalizados para mejorar los efectos visuales; \n\tAjuste de construcción de recursos raros: las decisiones de recursos raros solo aparecerán en planetas con designación industrial y, en los distritos rurales, si se pueden construir edificios de recursos raros, los edificios relacionados tendrán prioridad sin otras restricciones.\n\tSe corrigieron problemas por los que algunos edificios carecían de restricciones de reserva de minerales."
  MESSAGE_BCA_STARTUP_desc_log_v054: "\n§Y2026-1-25 - v0.5.4§!: \n\tSe añadió una decisión para ajustar la construcción de edificios de recursos raros; \n\tSe ajustaron los textos e iconos de las decisiones para mejorar su legibilidad; se corrigió un problema por el que los edificios de ensamblaje de población se seguían construyendo bajo condiciones de demolición; ahora los edificios de ensamblaje de población requieren más de un espacio de edificio y empleos libres para construirse"
  MESSAGE_BCA_STARTUP_desc_log_v053: "\n§Y2026-1-25 - v0.5.3§!: \n\tSe corrigió un error en el cálculo de producción de energía causado por un error de nomenclatura involuntario"
  MESSAGE_BCA_STARTUP_desc_log_v052: "\n§Y2026-1-25 - v0.5.2§!: \n\tSe corrigió y mejoró la lógica de automatización de edificios de recursos raros: tras construir la Refinería Arqueológica, ya no se construirán otros edificios de recursos raros. \n\tSe corrigió que las opciones de ensamblaje robótico seguían apareciendo en casos donde los robots están prohibidos o se ha elegido la evolución modificada."
  MESSAGE_BCA_STARTUP_desc_log_v051: "\n§Y2026-1-25 - v0.5.1§!: \n\tSe corrigió un error en el cálculo de producción de energía que provocaba que la proporción de distritos urbanos fuera demasiado baja. \n\tSe corrigió un problema por el que las zonas de bonificación no se eliminaban durante la conversión de distritos rurales."
  MESSAGE_BCA_STARTUP_desc_log_v05: "\n§Y2026-1-24 - v0.5§!: \n\tSe reescribió la lógica de §Hconstrucción y demolición de distritos rurales§!; cuando existe una zona de bonificación rural, el mod reequilibrará automáticamente los distritos urbanos y rurales para maximizar la producción"

  concept_bca_old_update_log: "Registros de actualizaciones antiguas"
  concept_bca_old_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v055$\n$MESSAGE_BCA_STARTUP_desc_log_v054$\n$MESSAGE_BCA_STARTUP_desc_log_v053$\n$MESSAGE_BCA_STARTUP_desc_log_v052$\n$MESSAGE_BCA_STARTUP_desc_log_v051$\n$MESSAGE_BCA_STARTUP_desc_log_v05$"

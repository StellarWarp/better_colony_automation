l_english:
  MESSAGE_BCA_STARTUP: "Better Colony Automation Notification"
  MESSAGE_BCA_STARTUP_desc: "§YBetter Colony Automation§! by 哇噗\n\nBCA follows your colony plan to build and remove buildings, districts, and zone specializations, while controlling construction pace through resource reserves, free jobs, pre-construction, and economic output targets.\n\n§HQuick start:§!\n- Enable ['concept_planet_automation'] in the planet interface and keep the automation options you want BCA to manage.\n- Check the colony district settings panel for zone specializations and district counts. Defaults follow the colony designation.\n- Use §HBCA Global Settings§! to configure resource reserves, free-job thresholds, pre-construction, economic management, and default auto-demolition behavior.\n\n§HGlobal settings entry points:§!\n- The upper-left button in the colony district settings panel.\n- The §HBCA Global Settings§! edict.\n\n§HNote§!: Building, district, and zone auto-demolition can be disabled separately. Configure defaults and bulk application in global settings."

  MESSAGE_BCA_UPDATE: "Better Colony Automation Update"
  MESSAGE_BCA_UPDATE_desc: "$MESSAGE_BCA_UPDATE_desc_verson$\n$MESSAGE_BCA_UPDATE_desc_important$\n$MESSAGE_BCA_STARTUP_desc_log$"
  MESSAGE_BCA_UPDATE_desc_verson: "§YBetter Colony Automation§! updated to v2.0.0 !"
  MESSAGE_BCA_UPDATE_desc_important: "§HNote§!: This mod has acquired a bunch of recent updates; checkout the Workshop page for more details.\n§RNOTE§!: This Mod now requires §1UI Overhaul Dynamic§! as a prerequisite mod.\nFeedback and discussion: Github or Workshop"
  MESSAGE_BCA_STARTUP_desc_log: "$MESSAGE_BCA_STARTUP_desc_log_v200$\n\n['concept_bca_1xx_update_log']"

  MESSAGE_BCA_STARTUP_desc_log_v200: "\n§Y2026-7-4 - v2.0.0§!:\n\t- §GEmpire job statistics and regulation§!: Added the optional §1Macroeconomy: Job Statistics & Regulation§! submod, with empire-wide job, workforce, and job-output statistics, resource-category filters, monthly job changes, automation rate, and job-output displays.\n\t\t- Quickly locate colonies that contain a selected job.\n\t\t- Automatically open or close relevant jobs according to BCA economic output targets and regulation tolerance, directing pops toward the sectors your economy currently needs.\n\t\t- Each job can be configured independently; for statistics only, you can disable Colony Automation and Global Job Regulation.\n\t- §GEconomic management and pre-construction§!: Reworked construction demand checks so pre-construction can build planned districts, zones, and buildings even when the empire does not currently need that output.\n\t\t- Added more specific build-demand triggers so pre-construction does not change job-regulation demand checks.\n\t\t- Economic targets, job reserve, and pre-construction now have clearer roles: whether output is needed, whether jobs should be reserved, and whether plans should be filled early.\n\t- §HSettings panel and UX fixes§!: Improved district planning, job-regulation display, and multilingual interface behavior.\n\t\t- When district auto-demolition is disabled, district plans now sync and clamp to the current layout instead of leaving stale plans that imply removal.\n\t\t- Fixed detailed secondary district buttons, dynamic district/zone text, long zone-name wrapping, job-regulation header icons, and related tooltips.\n\t\t- Fixed the global settings event being closed by the game's long-running event timeout.\n\t\t- Improved English, Japanese, and Russian localisation coverage, including missing, duplicate, and incorrectly generated text keys."
  MESSAGE_BCA_STARTUP_desc_log_v180: "\n§Y2026-6-23 - v1.8.0§!:\n\t- §GOutput target thresholds§!: The global settings panel now supports target thresholds for each output type. Automation expands related production only while empire monthly revenue is below the configured target; these thresholds only gate construction and do not change colony plans. The vanilla Avoid Deficit automation option has been removed and replaced by clearer output target controls.\n\t- §HFixes and UX improvements§!: When zone auto-demolition is disabled, the settings panel now syncs to already built zones; fixed several incorrect construction strategies and missing Nomad Arkship zone icons."
  MESSAGE_BCA_STARTUP_desc_log_v170: "\n§Y2026-6-20 - v1.7.0§!:\n\t- §GStellaris 4.4 support§!: Updated compatibility for Stellaris 4.4 and adapted changed script APIs that previously prevented automation from functioning.\n\t- §GNomad Arkship automation§!: Added automation support for the new Arkship designations, districts, zones, specialized buildings, and Passenger Dorm housing.\n\t- §HBuilding automation maintenance§!: Reworked the internal building automation configuration for more consistent construction and demolition rules."
  MESSAGE_BCA_STARTUP_desc_log_v161: "\n§Y2026-6-15 - v1.6.1§!:\n\t- §GMultiplayer global settings fix§!: Changing empire-wide global automation settings no longer affects other players in the same lobby.\n\t- §GMultiplayer planet-panel entry fix§!: The global settings entry on the planet UI now only appears for your own colonies and opens your country's panel."
  MESSAGE_BCA_STARTUP_desc_log_v160: "\n§Y2026-6-11 - v1.6§!:\n\t- §GGlobal automation settings panel§!: Added a unified empire-level panel for automation-related settings.\n\t- §GGlobal auto-demolition controls§!: Building, district, and zone auto-demolition defaults can now be configured separately for newly initialized colonies, with bulk actions for existing colonies.\n\t- §HGlobal settings UX improvements§!: Improved panel layout, tooltips, and threshold adjustment controls for resources and jobs."

  MESSAGE_BCA_STARTUP_desc_log_v150: "\n§Y2026-4-6 - v1.5§!:\n\t- §GJob calculation improvements§!: Previously, evaluating construction needs based on available jobs unintentionally counted non-primary species jobs. It has now been changed to count by social stratum.\n\t- §GFix and improve auto-district settings§!: Full support has been added for auto-management of all resource district types, including Betharian power plants and agricultural habitats. Fixed an issue where enabling auto-district settings caused construction to halt.\n\t- §GUnity buildings improvements§!: The construction logic for unity buildings is now more comprehensive.\n\t- §GFix and improve rare resource buildings logic§!: Rare resource buildings will now properly follow their preset values. §VAdditionally, if building slots are full, certain buildings may be replaced with rare resource ones.§!\n\t- §HImprove population assembly logic§!: Now provides more detailed policies to control the construction and demolition of population assembly buildings.\n\t- §HBuilding construction tweaks§!: Removed Fallen Empire building constructions from standard resource building plans.\n\t- §HFix specialization construction§!: Fixed an issue where secondary district specializations were incorrectly built on primary districts."
  MESSAGE_BCA_STARTUP_desc_log_v140: "\n§Y2026-4-1 - v1.4§!:\n\t- §GImproved Ecumenopolis Construction§!: When multiple ecumenopolis candidates meet the requirements, they will be aggregated into a single event panel for easier viewing\n\t- §GImproved Resort World Construction Logic§!: Now resort worlds will only build housing buildings as their functional buildings\n\t- §GEnergy and Mining Habitat Automatic District Management§!: Now supports district management for energy and mining habitats; when enabled, it will convert all districts to primary resource districts as much as possible\n\t- §HFixed Building Misconstruction Issue§!: Buildings in the former hybrid specialization were constructed according to the panel settings, causing some buildings to be incorrectly constructed on specializations that disabled them; this is now based on the constructed specialization\n\t- §HFixed Incorrect Building Demolition§!: The issue where research buildings were demolished under administrative hybrid specialization (Unity + Research) has been resolved"

  concept_bca_1xx_update_log: "1.x Update Logs"
  concept_bca_1xx_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v180$\n$MESSAGE_BCA_STARTUP_desc_log_v170$\n$MESSAGE_BCA_STARTUP_desc_log_v161$\n$MESSAGE_BCA_STARTUP_desc_log_v160$\n$MESSAGE_BCA_STARTUP_desc_log_v150$\n\n['concept_bca_prev_update_log']"
  concept_bca_prev_update_log: "Previous Update Logs"
  concept_bca_prev_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v130$\n$MESSAGE_BCA_STARTUP_desc_log_v120$\n$MESSAGE_BCA_STARTUP_desc_log_v110$\n$MESSAGE_BCA_STARTUP_desc_log_v102$\n$MESSAGE_BCA_STARTUP_desc_log_v101$\n$MESSAGE_BCA_STARTUP_desc_log_v100$\n\n['concept_bca_old_update_log']"

  MESSAGE_BCA_STARTUP_desc_log_v130: "\n§Y2026-2-28 - v1.3§!:\n\t- §GPerformance optimization§!\n\t- Rewrote automatic building demolition, now it does not depend on modifying vanilla buildings, §Gno longer conflicts with mods that modify vanilla buildings§!\n\t- Added support for demolishing buildings that only provide jobs (such as research labs) to free up space for advanced buildings\n\t- Fixed an issue where specialization construction would stop in certain situations"
  MESSAGE_BCA_STARTUP_desc_log_v120: "\n§Y2026-2-27 - v1.2§!: \n\t- Optimized construction priority for buildings that provide jobs, now these buildings will only be constructed when no district slots are available\n\t- Fixed the construction list for monument-type buildings, only constructing buildings with a planet limit of 1\n\t- Supported demolition of zones set through UI settings\n\t- Refined auto demolition options, adding separate options for buildings, districts, and boost zones\n\t- Fixed issues with incorrectly constructed specializations\n\t- When multiple district plans are available for construction, a random selection will now be made instead of always prioritizing the same district\n\t- Fixed an issue where the control panel was displayed in the colonizing interface"
  MESSAGE_BCA_STARTUP_desc_log_v110: "\n§Y2026-2-26 - v1.1§!: \n\t- Support for 4.3 version\n\t- Due to the removal of urban resource zone in 4.3, related logic has been greatly simplified \n\t- Fixed several issues with designed district construction and demolition"
  MESSAGE_BCA_STARTUP_desc_log_v102: "\n§Y2026-2-22 - v1.0.2§!: \n\t- Now for £energy£ £minerals£ £food£ specialization with §Cauto district management§! enabled (§Hdefault§!), §Rother rural districts will be replaced§!! \n\t- Adjusted the construction priority between urban resource zone and primary districts when no job requirements exist\n\t- Fixed an error that caused overconstruction of rural districts on volcanic or wilderness planets.\n\t- Removed some outdated localizations"
  MESSAGE_BCA_STARTUP_desc_log_v101: "\n§Y2026-2-20 - v1.0.1§!: \n\t- Fixed an issue where district construction ignored job requirements.\n\t- Fixed an issue where some districts were not built up to their configured caps.\n\t- Fixed an issue where city districts could not be replaced by primary-specialization districts when districts were full.\n\t- Added hybrid-planning construction support for resource buildings."
  MESSAGE_BCA_STARTUP_desc_log_v100: "\n§Y2026-2-20 - v1.0§!: \n\t§YMajor update§!:\n\t- Created a GUI for setting hybrid planning and district construction, and removed the previous hybrid planning planet types.\n\t- Hybrid planning planets can automatically build/replace districts and construct corresponding buildings.\n\t- Optimized construction logic for boost buildings; they will also be built when free jobs exist.\n\t- Rewrote primary-specialization planet building logic. Primary specialization will now automatically select optimal construction options based on build returns, and now supports almost all planet types."

  MESSAGE_BCA_STARTUP_desc_log_v055: "\n§Y2026-1-25 - v0.5.5§!: \n\tAdjusted decision texts for better readability, and the enable/disable positions of the same decision will no longer change. Added several custom decision icons to enhance visual effects; \n\tRare resource construction adjustment: Rare resource decisions will only appear on industrial designation planets, and for rural districts, if rare resource buildings can be constructed, related buildings will be prioritized without other restrictions.\n\tFixed issues where some buildings lacked mineral reservation constraints."
  MESSAGE_BCA_STARTUP_desc_log_v054: "\n§Y2026-1-25 - v0.5.4§!: \n\tAdded decision for rare resource building construction adjustment; \n\tAdjusted decision texts and icons for better readability; fixed issue where pop assembly buildings were still constructed under demolition conditions, pop assembly buildings now require more than one building slot and free jobs to be constructed"
  MESSAGE_BCA_STARTUP_desc_log_v053: "\n§Y2026-1-25 - v0.5.3§!: \n\tFixed an energy output calculation error caused by an unintended naming mistake"
  MESSAGE_BCA_STARTUP_desc_log_v052: "\n§Y2026-1-25 - v0.5.2§!: \n\tFixed and improve rare resource building automation logic : after building the Archaeological Refinery, other rare resource buildings will no longer be built. \n\tFixed the robot assembly options still shows up for cases where robots are outlawed or engineered evolution is taken."
  MESSAGE_BCA_STARTUP_desc_log_v051: "\n§Y2026-1-25 - v0.5.1§!: \n\tFixed an error in energy output calculation that caused city district ratios to be too low. \n\tFixed an issue where boost zones were not removed during rural district conversion."
  MESSAGE_BCA_STARTUP_desc_log_v05: "\n§Y2026-1-24 - v0.5§!: \n\tRewrote §Hrural district construction and demolition§! logic; when a rural boost zone exists the mod will automatically rebalance city districts and rural districts to maximize output"

  concept_bca_old_update_log: "Previous update logs"
  concept_bca_old_update_log_desc: "$MESSAGE_BCA_STARTUP_desc_log_v055$\n$MESSAGE_BCA_STARTUP_desc_log_v054$\n$MESSAGE_BCA_STARTUP_desc_log_v053$\n$MESSAGE_BCA_STARTUP_desc_log_v052$\n$MESSAGE_BCA_STARTUP_desc_log_v051$\n$MESSAGE_BCA_STARTUP_desc_log_v05$"
